<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8f4f0" />
    <script>
      // Light is the default for every first-time visitor (set on <html> above); the system light/dark
      // setting is deliberately ignored. Dark applies only if the visitor chose it with the toggle,
      // which is remembered. Done here, before first paint, so there is no flash.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#0a0706'
          document.querySelector('meta[name="color-scheme"]').content = 'dark'
        }
      } catch (e) {}
    </script>

    <title>Vijay PN | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Vijay PN, an AI/ML engineer building RAG systems, computer vision and full-stack software with Python, FastAPI and React."
    />
    <meta name="author" content="Vijay PN" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vijay PN" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="Vijay PN | Portfolio" />
    <meta
      property="og:description"
      content="I build intelligent applications using Python, PyTorch, React, FastAPI and RAG, focused on research-driven ideas and real-world impact."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vijay PN, AI/ML Engineer. Portfolio." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vijay PN | Portfolio" />
    <meta
      name="twitter:description"
      content="I build intelligent applications using Python, PyTorch, React, FastAPI and RAG, focused on research-driven ideas and real-world impact."
    />
    <meta name="twitter:image:alt" content="Vijay PN, AI/ML Engineer. Portfolio." />
    <!-- site-meta -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Vijay PN",
        "jobTitle": "AI/ML Engineer",
        "sameAs": [
          "https://github.com/Vijaypn87",
          "https://linkedin.com/in/vijaypnin",
          "https://x.com/Vijaypnin",
          "https://www.reddit.com/user/vijaypnin/"
        ],
        "knowsAbout": [
          "Machine learning",
          "RAG systems",
          "Computer vision",
          "Full-stack development"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; color: #1c1511; font-family: sans-serif">
        Vijay PN is an AI/ML engineer. This portfolio needs JavaScript to display. You can find
        Vijay on <a href="https://github.com/Vijaypn87">GitHub</a> and
        <a href="https://linkedin.com/in/vijaypnin">LinkedIn</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
